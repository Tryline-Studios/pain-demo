# The deployable stack (spec 2.2): `just up` builds both images on the host and publishes only localhost:8080.
name: pain-workbench

services:
  api:
    build:
      context: ./backend
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      PAIN_WORKBENCH_LOG_FORMAT: json
      PAIN_WORKBENCH_LOG_LEVEL: ${PAIN_WORKBENCH_LOG_LEVEL:-INFO}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
