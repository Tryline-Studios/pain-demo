name: backend

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          working-directory: backend
      - uses: extractions/setup-just@v4
      - run: uv sync --locked
      - run: just lint
        working-directory: .

  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          working-directory: backend
      - uses: extractions/setup-just@v4
      - run: uv sync --locked
      - run: just typecheck
        working-directory: .

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          working-directory: backend
      - uses: extractions/setup-just@v4
      - run: uv sync --locked
      - run: just test
        working-directory: .

  openapi-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          working-directory: backend
      - uses: extractions/setup-just@v4
      - run: uv sync --locked
      - run: just openapi-check
        working-directory: .
