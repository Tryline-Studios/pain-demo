name: backend

on:
  push:
  pull_request:

jobs:
  backend:
    name: ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One parallel job per just recipe: ruff, ty, pytest and the OpenAPI drift check.
        recipe: [backend-lint, backend-typecheck, backend-test, openapi-check]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: backend
      - uses: extractions/setup-just@v4
      - run: uv sync --locked
        working-directory: backend
      - run: just ${{ matrix.recipe }}

  # The Validation CLI runs on Windows laptops (spec 18.6): prove the CLI and the spawned XSD worker work there.
  windows-cli:
    name: cli on windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: backend
      - run: uv sync --locked
        working-directory: backend
      - run: uv run pytest tests/test_cli.py tests/test_validation_api.py
        working-directory: backend
