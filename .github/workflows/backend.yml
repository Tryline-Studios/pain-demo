name: backend

on:
  push:
  pull_request:

jobs:
  backend:
    name: ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One parallel job per just recipe: ruff, ty, pytest and the OpenAPI drift check.
        recipe: [backend-lint, backend-typecheck, backend-test, openapi-check]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          working-directory: backend
      - uses: extractions/setup-just@v4
      - run: uv sync --locked
        working-directory: backend
      - run: just ${{ matrix.recipe }}
