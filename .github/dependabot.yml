# Tooling and frameworks only (spec section 2.4). The five generator pins are upgraded by hand through
# `just upgrade-generators`, because their output feeds the Seed contract.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: pain001
      - dependency-name: Faker
      - dependency-name: schwifty
      - dependency-name: iuliia
      - dependency-name: rapidfuzz
    groups:
      tooling:
        patterns:
          - ruff
          - ty
          - prek
          - pytest*
          - httpx2
      frameworks:
        patterns:
          - "*"
        exclude-patterns:
          - ruff
          - ty
          - prek
          - pytest*
          - httpx2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # openapi-typescript builds the client with the JavaScript compiler API that TypeScript 6 and 7 no longer
      # ship (openapi-ts/openapi-typescript#2723 and #2841). Move the pin by hand once it supports them.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      tooling:
        patterns:
          - "@biomejs/*"
          - typescript
          - vite
          - "@vitejs/*"
          - vitest
          - "@testing-library/*"
          - "@types/*"
          - jsdom
          - msw
          - "@playwright/*"
          - openapi-typescript
          - shadcn
      frameworks:
        patterns:
          - "*"
        exclude-patterns:
          - "@biomejs/*"
          - typescript
          - vite
          - "@vitejs/*"
          - vitest
          - "@testing-library/*"
          - "@types/*"
          - jsdom
          - msw
          - "@playwright/*"
          - openapi-typescript
          - shadcn
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    ignore:
      # These follow .python-version and .node-version by hand, so the Dockerfiles keep the same pins (spec 2.3).
      - dependency-name: python
      - dependency-name: node
    groups:
      images:
        patterns:
          - "*"
