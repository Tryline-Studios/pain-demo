[project]
name = "pain-demo"
version = "0.1.0"
description = "Sample ISO 20022 pain.001 generator for testing a sanctions Screening Tool"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]",
    "lxml>=6.1.3",
    "pydantic",
    "pydantic-settings",
    "structlog",
    "uvicorn",
    # Generator pins: exact, excluded from Dependabot, bumped only by `just upgrade-generators` (spec 2.4).
    "pain001[fast]==0.0.70",
    "Faker==40.39.0",
    "schwifty==2026.7.3",
    "iuliia==0.13.0",
    "rapidfuzz==3.14.6",
]

[dependency-groups]
dev = [
    "httpx2",
    "hypothesis>=6.170.15",
    "prek",
    "pytest",
    "ruff",
    "ty==0.0.95",
    "types-lxml>=2026.2.16",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.9"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "FAST", "PT", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ty.src]
include = ["src", "tests"]
